<!DOCTYPE html>
<html>
<head>
    <title>Old Announcements</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background:#0c0a0f;
            color:white;
            font-family:Arial;
            padding:20px;
        }
    </style>

</head>

<body>

<div id="announcementPopup" class="announcement-popup">
    <div class="popup-content">
        <h2 id="popupTitle"></h2>
        <p id="popupMessage"></p>
        <button id="closeAnnouncement">Announcement Made</button>
    </div>
</div>


<h1>Old Announcements</h1>

<div id="oldAnnouncements">
    Loading...
</div>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="session.js"></script>

<script>

 async function syncCharacterData() {
            	// Check login using your PIN system
        	const playerID = sessionStorage.getItem("playerID");

        	if (!playerID) {
            	// No login → send back to login page
            	    window.location.href = "login.html";
            	    return;
                }

            // Pull their data directly from spellboundPlayers
            const { data: playerRow, error: dbError } = await sb
                .from('spellboundPlayers')
                .select('name')
                .eq('playerID', playerID)
                .single();

        	if (dbError || !playerRow) {
            	    document.getElementById("characterHeader").innerText = "Unauthorized";
            	    return;
        	}

        	// Display character name
        	document.getElementById("characterHeader").innerText = playerRow.name;
    	    }

	    syncCharacterData();

async function loadOldAnnouncements(){

    const playerID = sessionStorage.getItem("playerID");


    if(!playerID){
        window.location.href="login.html";
        return;
    }


    const {data,error}=await sb
        .from("announcements")
        .select("*")
        .eq("playerID",playerID)
        .eq("read",true)
        .order("id",{ascending:false});


    if(error){
        console.log(error);
        return;
    }


    const box=document.getElementById("oldAnnouncements");

    box.innerHTML="";


    if(data.length===0){

        box.innerHTML="<p>No old announcements.</p>";
        return;

    }



    data.forEach(item=>{


        box.innerHTML += `

        <div class="announcement-box">

            <h2>${item.title}</h2>

            <p>${item.announcement}</p>

        </div>

        `;


    });


}


loadOldAnnouncements();


</script>
</body>
</html>
