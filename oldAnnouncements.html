<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Announcements</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background:#0c0a0f;
            color:white;
            font-family:Arial;
            padding:20px;
        }
    </style>

</head>

<body>

<div id="announcementPopup" class="announcement-popup">
    <div class="popup-content">
    	<h2>Please announce to the group</h2>
	<h3 id="popupTitle"></h3>
	<p id="popupMessage"></p>
	<button id="closeAnnouncement">Announcement Made</button>
    </div>
</div>

<h1>Old Announcements</h1>

<div id="oldAnnouncements">
    Loading...
</div>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="session.js"></script>

<script>

async function loadOldAnnouncements(){

const playerName = sessionStorage.getItem("playerName");

    const { data, error } = await sb
        .from("announcements")
        .select("*")
        .eq("name", playerName)
        .eq("sent", true)
        .order("id", { ascending:false });


    if(error){
        console.log(error);
        return;
    }


    const box = document.getElementById("oldAnnouncements");

    box.innerHTML = "";


    if(data.length === 0){

        box.innerHTML = "<p>No old announcements.</p>";
        return;

    }


    data.forEach(item => {

        box.innerHTML += `

            <div class="announcement-box">

                <h3>${item.title}</h3>

                <p>${item.announcement}</p>

            </div>

        `;

    });

}


async function startPage(){

    const loggedIn = await verifyPlayerLogin();

    if (!loggedIn) {
        return;
    }

    loadOldAnnouncements();

}


startPage();

</script>
</body>
</html>
