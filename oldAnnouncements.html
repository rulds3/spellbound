<!DOCTYPE html>
<html>
<head>
    <title>Old Announcements</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background:#0c0a0f;
            color:white;
            font-family:Arial;
            padding:20px;
        }

        .announcement-box {
            background:#171122;
            border:2px solid #6d28d9;
            border-radius:12px;
            padding:20px;
            margin-bottom:15px;
        }

        h1 {
            color:#c084fc;
        }

        button {
            background:#7c3aed;
            color:white;
            border:none;
            padding:12px;
            border-radius:8px;
            cursor:pointer;
        }
    </style>

</head>

<body>

<h1>Old Announcements</h1>

<div id="oldAnnouncements">
    Loading...
</div>


<script>

const SUPABASE_URL = "https://ninumgueglotdpyewmhg.supabase.co";

const SUPABASE_KEY = "YOUR_KEY_HERE";


const sb = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



async function loadOldAnnouncements(){

    const playerID = sessionStorage.getItem("playerID");


    if(!playerID){
        window.location.href="login.html";
        return;
    }


    const {data,error}=await sb
        .from("announcements")
        .select("*")
        .eq("playerID",playerID)
        .eq("read",true)
        .order("id",{ascending:false});


    if(error){
        console.log(error);
        return;
    }


    const box=document.getElementById("oldAnnouncements");

    box.innerHTML="";


    if(data.length===0){

        box.innerHTML="<p>No old announcements.</p>";
        return;

    }



    data.forEach(item=>{


        box.innerHTML += `

        <div class="announcement-box">

            <h2>${item.title}</h2>

            <p>${item.announcement}</p>

        </div>

        `;


    });


}


loadOldAnnouncements();


</script>


</body>
</html>
