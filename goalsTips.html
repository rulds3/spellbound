<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals and Tips</title>
    <link rel="stylesheet" href="styles.css">
    <style>
    </style>
</head>

<body>
<div id="announcementPopup" class="announcement-popup">
    <div class="popup-content">
    	<h2>Please announce to the group</h2>
	<h3 id="popupTitle"></h3>
	<p id="popupMessage"></p>
	<button id="closeAnnouncement">Announcement Made</button>
    </div>
</div>

        <h1 id="characterHeader"></h1>

    <div class="text-box">
    <h2>Goals</h2>
    <div id="characterGoals"></div>
</div>

<div class="text-box">
    <h2>Tips</h2>
    <p id="characterTips"></p>
</div>

    <!-- A simple button to go straight back to your main button screen -->
    <a href="index.html" class="back-btn">Back</a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="session.js"></script>

    <script>
    	async function syncCharacterData() {

    const playerName = localStorage.getItem("playerName");

    document.getElementById("characterHeader").innerText = playerName;

    const { data: playerRow, error } = await sb
        .from('spellboundPlayers')
        .select('tips')
        .eq('name', playerName)
        .single();

    if (!error && playerRow) {
        document.getElementById("characterTips").innerHTML = playerRow.tips;
    }
}


	async function loadGoals() {
	    const playerName = localStorage.getItem("playerName");

    	    const { data: goals, error } = await sb
        	.from("playerGoals")
		.select("id, name, goalText, completed")
        	.eq("name", playerName)
    		.order("completed", { ascending: true })
 		.order("id", { ascending: true });
   	    
	    if (error) {
        	console.log(error);
        	return;
    	    }

    	  const goalBox = document.getElementById("characterGoals");

let html = "";

goals.forEach(goal => {

    html += `
        <p>
            <input
                type="checkbox"
                ${goal.completed ? "checked" : ""}
                onchange="completeGoal(${goal.id}, this.checked)">
            ${goal.goalText}
        </p>
    `;
});

goalBox.innerHTML = html;
}

	async function completeGoal(id, completed) {
    	    const { error } = await sb
        	.from("playerGoals")
        	.update({ completed: completed })
        	.eq("id", id);
	    if (error) {
        	console.log(error);
    	    }
	}



window.addEventListener("load", async () => {

    const loggedIn = await verifyPlayerLogin();

    if (!loggedIn) {
        return;
    }

    await syncCharacterData();
    await loadGoals();

});
     </script>

</body>
</html>
