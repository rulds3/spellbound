 	    <button class="game-btn" id="btn3">The Library</button>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

       	<script>

	    /* Map each button ID to the exact name of the file you want to open*/
   	    const buttonLinks = {
      		"btn3": "library.html",
      		"btn2": "timeline.html",
		"btn4": "libraryItems.html"
		"btn5": "libraryRules.html"
     	    };


window.addEventListener("load", async () => {

        document.querySelectorAll(".game-btn")
        .forEach(button => {

            button.addEventListener("click", () => {

                const targetPage = buttonLinks[button.id];

                if (targetPage) {
                    window.location.href = targetPage;
                }

            });

        });


 const loggedIn = await verifyPlayerLogin();

if (!loggedIn) {
    return;
}

const admin = await checkAdmin();

if (!admin) {
    return;
}

});  	

async function checkAdmin() {

    const playerID = localStorage.getItem("playerID");

    if (!playerID) {
        window.location.href = "login.html";
        return false;
    }


    const { data, error } = await sb
        .from("spellboundPlayers")
        .select("position")
        .eq("playerID", playerID)
        .single();


    if (error || !data) {
        window.location.href = "index.html";
        return false;
    }


    if (data.position?.toLowerCase() !== "admin") {
        window.location.href = "index.html";
        return false;
    }


    return true;
}   
	</script>
<a href="admin.html" class="back-btn">Back</a>
