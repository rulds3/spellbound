<script>

const notesBox = document.getElementById("notes");


// Load the player's notes from Supabase
async function loadNotes() {

    const playerID = localStorage.getItem("playerID");

    if (!playerID) {
        window.location.href = "login.html";
        return;
    }


    const { data, error } = await sb
        .from("spellboundPlayers")
        .select("notes")
        .eq("playerID", playerID)
        .single();


    if (error) {
        console.log("Error loading notes:", error);
        alert("Could not load your notes.");
        return;
    }


    // Put saved notes into the textarea
    notesBox.value = data?.notes || "";
}


// Save the player's notes to Supabase
async function saveNotes() {

    const playerID = localStorage.getItem("playerID");

    if (!playerID) {
        window.location.href = "login.html";
        return;
    }


    const { error } = await sb
        .from("spellboundPlayers")
        .update({
            notes: notesBox.value
        })
        .eq("playerID", playerID);


    if (error) {
        console.log("Error saving notes:", error);
    }
}


// Load notes when the page opens
window.addEventListener("load", loadNotes);


// Save automatically as the player types
notesBox.addEventListener("input", saveNotes);


</script>

</body>
</html>
