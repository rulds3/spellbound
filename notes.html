<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>

<link rel="stylesheet" href="styles.css">

<style>

.notes-box {
    width: 90%;
    max-width: 700px;
    margin: 20px auto;
}

#notes {
    width: 100%;
    height: 400px;
    padding: 15px;
    font-size: 1rem;
    border-radius: 10px;
    box-sizing: border-box;
}

.notes-box .game-btn {
    display: block;
    margin: 20px auto 0;
}

</style>

</head>

<body>

<h1>My Notes</h1>

<div class="text-box notes-box">

<textarea id="notes" placeholder="Write your notes here..."></textarea>

</div>

<a href="index.html" class="back-btn">Back</a>


    <script src="session.js"></script>

<script>

const notesBox = document.getElementById("notes");


// Load saved notes when page opens
window.addEventListener("load", () => {

    notesBox.value =
        localStorage.getItem("playerNotes") || "";

});


// Save automatically as they type
notesBox.addEventListener("input", () => {

    localStorage.setItem(
        "playerNotes",
        notesBox.value
    );

});

</script>


</body>
</html>
