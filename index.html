<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Terminal</title>
    <link rel="stylesheet" href="styles.css">

</head>
    <body>

<div id="announcementPopup" class="announcement-popup">
    <div class="popup-content">
    	<h2>Please announce to the group</h2>
	<h3 id="popupTitle"></h3>
	<p id="popupMessage"></p>
	<button id="closeAnnouncement">Announcement Made</button>
    </div>
</div>

	<h1 id="characterHeader"></h1>

   	<!-- Container holding the 9 distinct buttons -->
    	<div class="button-grid">
	    <button class="game-btn" id="reference">For Reference</button>
            <button class="game-btn" id="btn7">Intro & Newspaper</button>
            <button class="game-btn" id="btn1">Character Information</button>
            <button class="game-btn" id="btn2">Goals and Tips</button>
            <button class="game-btn" id="btn3">Dirt and Cast</button>
            <button class="game-btn" id="btn4">Abilities</button>
            <button class="game-btn" id="btn5">Secret and Info</button>
            <button class="game-btn" id="btn8">Exam Information</button>
            <button class="game-btn" id="btn9">Old Announcements</button>
            <button class="game-btn" id="btn6">Rules</button>
<button id="professorButton" class="game-btn" style="display:none;">
    Grades
</button>

        </div>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="session.js"></script>

       	<script>

	    /* Map each button ID to the exact name of the file you want to open*/
   	    const buttonLinks = {
      		"btn1": "characterInfo.html",
      		"btn2": "goalsTips.html",
      		"btn3": "dirtCast.html",
      		"btn4": "abilities.html",
      		"btn5": "secretNInfo.html",
      		"btn6": "rulesForSpellbound.html",
      		"btn7": "introPaper.html",
      		"btn8": "examInfo.jpg",
		"btn9": "oldAnnouncements.html",
		"professorButton": "grades.html"
		"reference": "reference.html"
   	    };




window.addEventListener("load", async () => {

    const player = JSON.parse(
        localStorage.getItem("playerData")
    );

    if (player) {

        document.getElementById("characterHeader").innerText =
            player.name;

        if (player.position?.toLowerCase() === "professor") {
            document.getElementById("professorButton")
                .style.display = "block";
        }
    }


    document.querySelectorAll(".game-btn")
        .forEach(button => {

            button.addEventListener("click", () => {

                const targetPage = buttonLinks[button.id];

                if (targetPage) {
                    window.location.href = targetPage;
                }

            });

        });


    const loggedIn = await verifyPlayerLogin();

    if (!loggedIn) {
        return;
    }

});  	   
	</script>
    </body>
</html>
