<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0c0a0f; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .dashboard-box { background: rgba(17, 12, 28, 0.85); padding: 40px; border-radius: 12px; max-width: 500px; width: 90%; text-align: center; border: 1px solid #4c1d95; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 2.2rem; color: #ffd700; margin-top: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .logout-btn { background: #333; color: #aaa; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 30px; font-size: 0.9rem; }
        .logout-btn:hover { background: #444; color: #fff; }
    </style>
</head>
<body>

    <div class="dashboard-box">
        <!-- Renders the 'name' heading value directly from the database row -->
        <h1 id="characterHeader">Loading...</h1>
        <p id="characterStatus">Accessing static terminal configuration...</p>
        
        <hr style="border-color: #2e2640; margin: 20px 0;">
        <p>Your session is active and secure.</p>

        <button class="logout-btn" id="logoutBtn">Disconnect Session</button>
    </div>

<script>
const SUPABASE_URL = "https://ninumgueglotdpyewmhg.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pbnVtZ3VlZ2xvdGRweWV3bWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjQ5NjcsImV4cCI6MjEwMDk0MDk2N30.CyBpEIcTWG9J9Ijx1q1Hh6ZEtX1r4t5UeQCA6BmplhM";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


        async function syncCharacterData() {
            const { data: { user }, error: authError } = await sb.auth.getUser();

const result = await sb.auth.getUser();
console.log(result);

            if (authError || !user) {
                window.location.href = "login.html";
                return;
            }

            // Pull their data directly from the spellboundPlayers row matching their ID
            const { data: playerRow, error: dbError } = await sb
                .from('spellboundPlayers')
                .select('name')
                .eq('playerID', user.id)
                .single();

            if (dbError || !playerRow) {
                document.getElementById("characterHeader").innerText = "Unauthorized";
                document.getElementById("characterStatus").innerText = "Character data unmapped.";
                return;
            }

            // Lock their custom 'name' straight into the main text header
            document.getElementById("characterHeader").innerText = playerRow.name;
            document.getElementById("characterStatus").innerText = "Terminal Synced Successfully.";
        }

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            await sb.auth.signOut();
            window.location.href = "login.html";
        });

        syncCharacterData();
    </script>
</body>
</html>
