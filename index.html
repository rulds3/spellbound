<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Terminal</title>
    <link rel="stylesheet" href="styles.css">
    <style>
    </style>

</head>
    <body>

<div id="announcementPopup" class="announcement-popup">
    <div class="popup-content">
    	<h2>PLEASE ANNOUNCE</h2>
	<h2>TO THE GROUP</h2>
	<h3 id="popupTitle"></h3>
	<p id="popupMessage"></p>
	<button id="closeAnnouncement">Announcement Made</button>
    </div>
</div>

	<h1 id="characterHeader">Loading...</h1>

   	<!-- Container holding the 9 distinct buttons -->
    	<div class="button-grid">
            <button class="game-btn" id="btn1">Character Information</button>
            <button class="game-btn" id="btn2">Goals and Tips</button>
            <button class="game-btn" id="btn3">Cast</button>
            <button class="game-btn" id="btn4">Abilities</button>
            <button class="game-btn" id="btn5">Secret and Info</button>
            <button class="game-btn" id="btn6">Rules</button>
            <button class="game-btn" id="btn7">The Sorcerer's Scoop</button>
            <button class="game-btn" id="btn8">Exam Information</button>
            <button class="game-btn" id="btn9">Old Announcements</button>
        </div>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="session.js"></script>

       	<script>
    	   async function syncCharacterData() {
            	// Check login using your PIN system
        	const playerID = sessionStorage.getItem("playerID");

        	if (!playerID) {
            	// No login → send back to login page
            	    window.location.href = "login.html";
            	    return;
                }

            // Pull their data directly from spellboundPlayers
            const { data: playerRow, error: dbError } = await sb
                .from('spellboundPlayers')
                .select('name')
                .eq('playerID', playerID)
                .single();

        	if (dbError || !playerRow) {
            	    document.getElementById("characterHeader").innerText = "Unauthorized";
            	    return;
        	}

        	// Display character name
        	document.getElementById("characterHeader").innerText = playerRow.name;
    	    }

	    /* Map each button ID to the exact name of the file you want to open*/
   	    const buttonLinks = {
      		"btn1": "characterInfo.html",
      		"btn2": "goalsTips.html",
      		"btn3": "castList.pdf",
      		"btn4": "abilities.html",
      		"btn5": "secretNInfo.html",
      		"btn6": "rulesForSpellbound.html",
      		"btn7": "sorcerersScoop.pdf",
      		"btn8": "examInfo.pdf",
		"btn9": "oldAnnouncements.html"
   	    };

   	    /* Loop through all buttons and add the click feature*/
   	    document.querySelectorAll('.game-btn').forEach(button => {
       		button.addEventListener('click', (event) => {
           	const buttonId = event.target.id;
           	const targetPage = buttonLinks[buttonId];

           	if (targetPage) {
           	    /*This line tells the browser to change pages instantly*/
            	    window.location.href = targetPage;
            	}
       	    	});
  	    });

if (verifyPlayerLogin()) {
    syncCharacterData();
}
    	   
	</script>
    </body>
</html>
