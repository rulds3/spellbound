<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcement Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
        body {
            background-color: #1b1a24;
            color: #f5e6c8;
            font-family: Georgia, serif;
            margin: 0;
            padding: 20px;
        }

        .text-box {
            max-width: 800px;
            margin: auto;
            background-color: #2b2838;
            border: 3px solid #c9a227;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            color: #ffd966;
        }

        h2 {
            color: #ffd966;
            border-bottom: 1px solid #c9a227;
            padding-bottom: 5px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        select,
        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            background-color: #161521;
            color: #f5e6c8;
            border: 2px solid #c9a227;
            border-radius: 8px;
            padding: 10px;
            font-family: Georgia, serif;
            font-size: 16px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            background-color: #c9a227;
            color: #1b1a24;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            margin-top: 15px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #ffd966;
        }

        .button-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .announcement-box {
            background-color: #161521;
            border: 2px solid #c9a227;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .announcement-box h3 {
            margin-top: 0;
            color: #ffd966;
        }

        .pending {
            border-color: #e67e22;
        }

        .sent {
            border-color: #2ecc71;
        }

        .delete-button {
            background-color: #8b0000;
            color: white;
        }

        .delete-button:hover {
            background-color: #b22222;
        }

        .edit-button {
            background-color: #4169e1;
            color: white;
        }

        .edit-button:hover {
            background-color: #6495ed;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 25px auto;
            padding: 10px 20px;
            background-color: #c9a227;
            color: #1b1a24;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .status {
            text-align: center;
            margin: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="text-box">

    <h1>Announcement Admin</h1>

    <div id="unauthorized" class="status hidden">
        You do not have admin access.
    </div>


    <div id="adminPanel">

        <h2>Create Announcement</h2>

        <label for="playerSelect">
            Send To Player:
        </label>

        <select id="playerSelect" multiple>
            <option value="">
                Loading players...
            </option>
        </select>


        <label for="announcementTitle">
            Title:
        </label>

        <input 
            id="announcementTitle"
            type="text"
            placeholder="Announcement title">


        <label for="announcementText">
            Announcement:
        </label>

        <textarea 
            id="announcementText"
            placeholder="Announcement text (HTML allowed)">
        </textarea>


       <div class="button-row">

            <button id="sendNowButton">
		Create Announcement
            </button>
        </div>


        <h2>Existing Announcements</h2>

        <div id="announcementList">
            Loading announcements...
        </div>

    </div>

</div>


<a href="index.html" class="back-btn">
    Back
</a>


<script>
const SUPABASE_URL = "https://ninumgueglotdpyewmhg.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pbnVtZ3VlZ2xvdGRweWV3bWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjQ5NjcsImV4cCI6MjEwMDk0MDk2N30.CyBpEIcTWG9J9Ijx1q1Hh6ZEtX1r4t5UeQCA6BmplhM";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


let announcements = [];
let editingId = null;

async function checkAdmin() {

    const playerID = sessionStorage.getItem("playerID");

    if (!playerID) {
        document.getElementById("adminPanel").classList.add("hidden");
        document.getElementById("unauthorized").classList.remove("hidden");
        return false;
    }


    const { data, error } = await sb
        .from("spellboundPlayers")
        .select("position")
        .eq("playerID", playerID)
        .single();


    if (error || !data) {
        console.log(error);
        document.getElementById("adminPanel").classList.add("hidden");
        document.getElementById("unauthorized").classList.remove("hidden");
        return false;
    }


    if (data.position?.toLowerCase() !== "admin")        	document.getElementById("adminPanel").classList.add("hidden");
        document.getElementById("unauthorized").classList.remove("hidden");
        return false;
    }


    return true;
}


// Load all players for dropdown
async function loadPlayers() {

    const { data, error } = await sb
        .from("spellboundPlayers")
        .select("playerID, name")
        .order("name", { ascending: true });


    if (error) {
        console.log(error);
        return;
    }


    const playerSelect = document.getElementById("playerSelect");

    playerSelect.innerHTML = "";


    data.forEach(player => {

        playerSelect.innerHTML += `
            <option value="${player.name}">
                ${player.name}
            </option>
        `;

    });

}



// Load announcements
async function loadAnnouncements() {

    const { data, error } = await sb
        .from("announcements")
        .select(`
    	    id,
    	    name,
    	    title,
    	    announcement,
    	    sent,
    	    read
	`)

	.order("id", { ascending: true });

    if (error) {
        console.log(error);
        return;
    }


    announcements = data;


    displayAnnouncements();

}



// Display announcements in admin list
function displayAnnouncements() {

    const box = document.getElementById("announcementList");

    box.innerHTML = "";


    if (announcements.length === 0) {

        box.innerHTML = `
            <p>No announcements found.</p>
        `;

        return;
    }



    announcements.forEach(item => {


        box.innerHTML += `

            <div class="announcement-box 
                ${item.sent ? "sent" : "pending"}">

                <h3>${item.title}</h3>

                <p>
                    <strong>Name:</strong>
		    ${item.name}
                </p>

                <p>
                    ${item.announcement}
                </p>


                <p>
                    <strong>Status:</strong>
                    ${item.sent ? "Sent" : "Ready to Send"}
                </p>


<button 
    class="send-button"
    onclick="sendAnnouncement(${item.id})">
    Send Now
</button>

<button 
    class="edit-button"
    onclick="editAnnouncement(${item.id})">
    Edit
</button>

<button 
    class="delete-button"
    onclick="deleteAnnouncement(${item.id})">
    Delete
</button>


            </div>

        `;

    });

}




// Startup
async function startAdminPage() {

    const allowed = await checkAdmin();


    if (!allowed) {
        return;
    }


    await loadPlayers();

    await loadAnnouncements();

}


startAdminPage();

async function sendAnnouncement(id) {

    const confirmed = confirm(
        "Send this announcement to the player?"
    );

    if (!confirmed) {
        return;
    }


   const { error } = await sb
    .from("announcements")
    .update({
        sent: true,
        read: false
    })
    .eq("id", id);


    if (error) {
        console.log("Send error:", error);
        alert("Could not send announcement.");
        return;
    }

    loadAnnouncements();

}



// ================================
// SEND ANNOUNCEMENT NOW
// ================================

async function sendAnnouncementNow() {

    const name = document.getElementById("playerSelect").value;
    const title = document.getElementById("announcementTitle").value;
    const message = document.getElementById("announcementText").value;

    if (!name || !title || !message) {
        alert("Please fill in all fields.");
        return;
    }

    let error;

    if (editingId) {

        ({ error } = await sb
            .from("announcements")
            .update({
                name,
                title,
                announcement: message
            })
            .eq("id", editingId));

    } else {

        ({ error } = await sb
            .from("announcements")
            .insert({
                name,
                title,
                announcement: message,
                sent: false,
                read: false
            }));

    }

    if (error) {
        console.log(error);
        return;
    }

    editingId = null;

    document.getElementById("sendNowButton").textContent =
        "Create Announcement";

    clearAnnouncementForm();
    loadAnnouncements();
}




// ================================
// EDIT ANNOUNCEMENT
// ================================

async function editAnnouncement(id) {

    const announcement = announcements.find(
        item => item.id === id
    );

    if (!announcement) {
        return;
    }

    editingId = id;

    document.getElementById("announcementTitle").value =
        announcement.title;

    document.getElementById("announcementText").value =
        announcement.announcement;

    document.getElementById("playerSelect").value =
        announcement.name;

    document.getElementById("sendNowButton").textContent =
        "Save Changes";
}



// ================================
// DELETE ANNOUNCEMENT
// ================================

async function deleteAnnouncement(id) {


    if (!confirm("Delete this announcement?")) {
        return;
    }



    const { error } = await sb
        .from("announcements")
        .delete()
        .eq("id", id);



    if (error) {

        console.log(error);
        return;

    }



    loadAnnouncements();

}



// ================================
// CLEAR FORM
// ================================

function clearAnnouncementForm() {

    const title = document.getElementById("announcementTitle");
    const text = document.getElementById("announcementText");

    if (title) title.value = "";
    if (text) text.value = "";
}



// ================================
// BUTTON CONNECTIONS
// ================================

document
    .getElementById("sendNowButton")
    .addEventListener(
        "click",
        sendAnnouncementNow
    );

</script>


</body>
</html>
