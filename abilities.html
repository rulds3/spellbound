<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abilities</title>
    <link rel="stylesheet" href="styles.css">
    <style>     
	.ability-box {
    	    background-color: #1e1e2f;
    	    border: 2px solid #c9a227;
    	    border-radius: 12px;
    	    padding: 15px;
    	    margin: 15px 0;
    	    color: #f5e6c8;
	}

	.used-up {
    	    opacity: 0.5;
    	    border-color: gray;
	}
    </style>
</head>

<body>
<div id="announcementPopup" class="announcement-popup">
    <div class="popup-content">
    	<h2>Please announce to the group</h2>
	<h3 id="popupTitle"></h3>
	<p id="popupMessage"></p>
	<button id="closeAnnouncement">Announcement Made</button>
    </div>
</div>

        <h1 id="characterHeader"></h1>


    <div class="text-box">
	<h2>Abilities</h2>
        <div id="characterAbilities"></div>
    </div>

    <!-- A simple button to go straight back to your main button screen -->
    <a href="index.html" class="back-btn">Back</a>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
 <script src="session.js"></script>

    <script>
async function loadCharacterName() {

    const playerID = localStorage.getItem("playerID");

    const { data: player, error } = await sb
        .from("spellboundPlayers")
        .select("name")
        .eq("playerID", playerID)
        .single();

    if (error) {
        console.log(error);
        return;
    }

    document.getElementById("characterHeader").textContent = player.name;
}

function verifyPlayerLogin() {

    const playerID = localStorage.getItem("playerID");

    if (!playerID) {
        window.location.href = "login.html";
        return false;
    }

    return true;
}


async function loadAbilities() {

    const playerID = localStorage.getItem("playerID");

    const { data: abilities, error } = await sb
        .from("playerAbilities")
        .select("*")
        .eq("playerID", playerID)
        .order("id", { ascending: true });

    if (error) {
        console.log(error);
        return;
    }

    const abilityBox = document.getElementById("characterAbilities");

    abilityBox.innerHTML = "";

    abilities.forEach(ability => {

        abilityBox.innerHTML += `
            <div class="ability-box ${ability.usesRemaining <= 0 ? "used-up" : ""}">

                ${ability.ability}

                <p>
                    Uses remaining:
                    <strong>${ability.usesRemaining}</strong>
                </p>

                <button class="ability-button" onclick="useAbility(${ability.id}, ${ability.usesRemaining})"
    ${ability.usesRemaining <= 0 ? "disabled" : ""}>
    Use Ability
</button>

<button class="ability-button" onclick="undoAbility(${ability.id}, ${ability.usesRemaining}, ${ability.maxUses})"
    ${ability.usesRemaining >= ability.maxUses ? "disabled" : ""}>
    Undo
</button>

            </div>
        `;
    });
}


async function useAbility(id, currentUses) {

    if (currentUses <= 0) {
        return;
    }

    await sb
        .from("playerAbilities")
        .update({
            usesRemaining: currentUses - 1
        })
        .eq("id", id);

    loadAbilities();
}


async function undoAbility(id, currentUses, maxUses) {

    if (currentUses >= maxUses) {
        return;
    }

    await sb
        .from("playerAbilities")
        .update({
            usesRemaining: currentUses + 1
        })
        .eq("id", id);

    loadAbilities();
}


window.addEventListener("load", async () => {

    const loggedIn = await verifyPlayerLogin();

    if (!loggedIn) {
        return;
    }

   await loadCharacterName();
    await loadAbilities();

});
</script>
</body>
</html>
