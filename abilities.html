<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Abilities</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            /*background-color: #0b2212;  Dark green theme */
	    background-image: url('magicBackground.png');
	    background-size: cover;
   	    background-position: center;
    	    background-repeat: no-repeat;
	   
	    color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;            
            padding-top: 50px;
        }

        .back-btn {
            //background-color: #333;
	    background-color: #001F3F;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

	p {
    	    /*max-width: 600px;    Prevents text from stretching wider than 600 pixels */
            /*margin: 0 auto;       Centers the text block perfectly on the screen */
            /*padding: 0 20px;      Adds a safety cushion on the left/right for mobile screens */
            line-height: 1.6;     /* Spaces out lines of text so they are easier to read */
            font-size: 1.1rem;    /* Makes the text slightly larger and cleaner */
	    margin-bottom: 20px;
	}

	.text-box {
    	   /* 0, 0, 0 is black. 0.8 means 85% solid, 15% transparent */
    	   background-color: rgba(0, 31, 63, 0.85); 
    
   	   max-width: 650px;           /* Sets the width limit of the box */
	   margin: 50px auto;          /* Centers the box and pushes it down from the top */
	   padding: 40px;              /* Adds breathing room inside the box around your text */
    	   border-radius: 12px;        /* Smooths out the corners of the box */
    	   box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5); /* Adds a subtle shadow beneath the box */
	}

	.ability-box {
    	    background-color: #1e1e2f;
    	    border: 2px solid #c9a227;
    	    border-radius: 12px;
    	    padding: 15px;
    	    margin: 15px 0;
    	    color: #f5e6c8;
	}

    </style>
</head>

<body>
    <div class="text-box">
	<h2>Abilities</h2>
        <div id="characterAbilities"></div>
    </div>

    <!-- A simple button to go straight back to your main button screen -->
    <a href="index.html" class="back-btn">Back</a>



    <script>
        const SUPABASE_URL = "https://ninumgueglotdpyewmhg.supabase.co";
        const SUPABASE_KEY = 				 "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pbnVtZ3VlZ2xvdGRweWV3bWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjQ5NjcsImV4cCI6MjEwMDk0MDk2N30.CyBpEIcTWG9J9Ijx1q1Hh6ZEtX1r4t5UeQCA6BmplhM";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    	async function loadAbilities() {
	    const playerID = sessionStorage.getItem("playerID");

    	    const { data: abilities, error } = await sb
        	.from("playerAbilities")
        	.select("*")
        	.eq("playerID", playerID)
 		.order("playerID", { ascending: true });
   	   
	    if (error) {
        	console.log(error);
        	return;
    	    }

    	    const abilityBox = document.getElementById("characterAbilities");
	    abilityBox.innerHTML = "";
	
   	    abilities.forEach(ability => {
                abilityBox.innerHTML += `
		    <div class="ability-box">
                        ${ability.ability}

                    	<p>
                            Uses remaining: <strong>${ability.usesRemaining}</strong>
                        </p>
                        
			<button 
                            onclick="useAbility(${ability.id}, ${ability.usesRemaining})"
                            ${ability.usesRemaining <= 0 ? "disabled" : ""}
                        >
                            Use Ability
                        </button>
                    </div>
            `    ;
    	    });
	}


	async function useAbility(id, currentUses) {
	    if (currentUses <= 0) {
                return;
            }

     	    const newUses = currentUses - 1;

    	    const { error } = await sb
        	.from("playerAbilities")
        	.update({ usesRemaining: newUses })
        	.eq("id", id);

    	    if (error) {
        	console.log(error);
        	return;
    	    }

    	    // Refresh the display
    	    loadAbilities();
	}

	loadAbilities();
     </script>
</body>
</html>
