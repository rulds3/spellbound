<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rules for Spellbound</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            /*background-color: #0b2212;  Dark green theme */
	    background-image: url('magicBackground.png');
	    background-size: cover;
   	    background-position: center;
    	    background-repeat: no-repeat;
	   
	    color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;            
            padding-top: 50px;
        }

        .back-btn {
            //background-color: #333;
	    background-color: #001F3F;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

	p {
    	    /*max-width: 600px;    Prevents text from stretching wider than 600 pixels */
            /*margin: 0 auto;       Centers the text block perfectly on the screen */
            /*padding: 0 20px;      Adds a safety cushion on the left/right for mobile screens */
            line-height: 1.6;     /* Spaces out lines of text so they are easier to read */
            font-size: 1.1rem;    /* Makes the text slightly larger and cleaner */
	    margin-bottom: 20px;
	}

	.text-box {
    	   /* 0, 0, 0 is black. 0.8 means 85% solid, 15% transparent */
    	   background-color: rgba(0, 31, 63, 0.85); 
    
   	   max-width: 650px;           /* Sets the width limit of the box */
	   margin: 50px auto;          /* Centers the box and pushes it down from the top */
	   padding: 40px;              /* Adds breathing room inside the box around your text */
    	   border-radius: 12px;        /* Smooths out the corners of the box */
    	   box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5); /* Adds a subtle shadow beneath the box */
	}

    </style>
</head>

<body>
    <div class="text-box">
        <h1 id="characterHeader"></h1>
        <p id="characterInformation"></p>
    </div>

    <!-- A simple button to go straight back to your main button screen -->
    <a href="index.html" class="back-btn">Back</a>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
 <script src="session.js"></script>

    <script>

    	async function syncCharacterData() {
            // Check login using your PIN system
            const playerID = sessionStorage.getItem("playerID");

            if (!playerID) {
            // No login → send back to login page
                window.location.href = "login.html";
                return;
            }

            // Pull their data directly from spellboundPlayers
            const { data: playerRow, error: dbError } = await sb
                .from('spellboundPlayers')
                .select('name, characterInfo')
                .eq('playerID', playerID)
                .single();

        	if (dbError || !playerRow) {
            	    document.getElementById("characterHeader").innerText = "Unauthorized";
              	    return;
        	}

        	// Display character information
        	document.getElementById("characterHeader").innerText = playerRow.name;
        	document.getElementById("characterInformation").innerText = playerRow.characterInfo;
    	    }
	syncCharacterData();
     </script>
</body>
</html>
