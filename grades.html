<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grades</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="announcementPopup" class="announcement-popup">
    <div class="popup-content">
    	<h2>Please announce to the group</h2>
	<h3 id="popupTitle"></h3>
	<p id="popupMessage"></p>
	<button id="closeAnnouncement">Announcement Made</button>
    </div>
</div>

<h1>Grade Book</h1>

<div class="text-box">
    <table class="grade-table">
        <thead>
            <tr>
                <th></th>
                <th>Alchemy</th>
                <th>Trans.</th>
                <th>Fore.</th>
            </tr>
        </thead>
        <tbody id="gradeTableBody">
        </tbody>
    </table>
</div>

<a href="index.html" class="back-btn">Back</a>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="session.js"></script>

<script>

async function loadGrades() {

    const { data, error } = await sb
        .from("gradeTable")
        .select("id, name, alchemy, transformation, foretelling")
        .order("name");

    if (error) {
        console.log(error);
        return;
    }

    const tbody = document.getElementById("gradeTableBody");

       let html = "";

 data.forEach(player => {

    html += `
    <tr>
        <td>${player.name}</td>

        <td contenteditable="true"
            onblur="updateGrade(${player.id}, 'alchemy', this.innerText)"
            onkeydown="saveOnEnter(event)">
            ${player.alchemy || ""}
        </td>

        <td contenteditable="true"
            onblur="updateGrade(${player.id}, 'transformation', this.innerText)"
            onkeydown="saveOnEnter(event)">
            ${player.transformation || ""}
        </td>

        <td contenteditable="true"
            onblur="updateGrade(${player.id}, 'foretelling', this.innerText)"
            onkeydown="saveOnEnter(event)">
            ${player.foretelling || ""}
        </td>

    </tr>`;
});

    tbody.innerHTML = html;

}

function saveOnEnter(event) {

    if (event.key === "Enter") {
        event.preventDefault();
        event.target.blur();
    }

}

async function updateGrade(id, column, value) {

    value = value.trim().toUpperCase();


    const validGrades = ["A", "B", "C", "D", "F"];


    if (value !== "" && !validGrades.includes(value)) {

        alert("Please enter only A, B, C, D, or F.");

        return;
    }


    const { error } = await sb
        .from("gradeTable")
        .update({
            [column]: value === "" ? null : value
        })
        .eq("id", id);


    if (error) {

        console.log("Grade update failed:", error);
        return;

    }

}


window.addEventListener("load", async () => {

    const loggedIn = await verifyPlayerLogin();

    if (!loggedIn) {
        return;
    }

    await loadGrades();

});
</script>
</body>
</html>
