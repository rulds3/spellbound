<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grades</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="announcementPopup" class="announcement-popup">
    <div class="popup-content">
    	<h2>Please announce to the group</h2>
	<h3 id="popupTitle"></h3>
	<p id="popupMessage"></p>
	<button id="closeAnnouncement">Announcement Made</button>
    </div>
</div>

<h1>Grade Book</h1>

<div class="text-box">
    <table class="grade-table">
        <thead>
            <tr>
                <th></th>
                <th>Alchemy</th>
                <th>Transformation</th>
                <th>Foretelling</th>
            </tr>
        </thead>
        <tbody id="gradeTableBody">
        </tbody>
    </table>
</div>

<a href="index.html" class="back-btn">Back</a>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="session.js"></script>

<script>

async function loadGrades() {

    const { data, error } = await sb
        .from("gradeTable")
        .select("*")
        .order("name");

    if (error) {
        console.log(error);
        return;
    }

    const tbody = document.getElementById("gradeTableBody");
    tbody.innerHTML = "";

    data.forEach(player => {

        tbody.innerHTML += `
        <tr>
            <td>${player.name}</td>

            <td>
    <select onchange="updateGrade(${player.id}, 'alchemy', this.value)">
        <option value="">--</option>
        <option value="A" ${player.alchemy === "A" ? "selected" : ""}>A</option>
        <option value="B" ${player.alchemy === "B" ? "selected" : ""}>B</option>
        <option value="C" ${player.alchemy === "C" ? "selected" : ""}>C</option>
        <option value="D" ${player.alchemy === "D" ? "selected" : ""}>D</option>
        <option value="F" ${player.alchemy === "F" ? "selected" : ""}>F</option>
    </select>
</td>

<td>
    <select onchange="updateGrade(${player.id}, 'transformation', this.value)">
        <option value="">--</option>
        <option value="A" ${player.transformation === "A" ? "selected" : ""}>A</option>
        <option value="B" ${player.transformation === "B" ? "selected" : ""}>B</option>
        <option value="C" ${player.transformation === "C" ? "selected" : ""}>C</option>
        <option value="D" ${player.transformation === "D" ? "selected" : ""}>D</option>
        <option value="F" ${player.transformation === "F" ? "selected" : ""}>F</option>
    </select>
</td>

<td>
    <select onchange="updateGrade(${player.id}, 'foretelling', this.value)">
        <option value="">--</option>
        <option value="A" ${player.foretelling === "A" ? "selected" : ""}>A</option>
        <option value="B" ${player.foretelling === "B" ? "selected" : ""}>B</option>
        <option value="C" ${player.foretelling === "C" ? "selected" : ""}>C</option>
        <option value="D" ${player.foretelling === "D" ? "selected" : ""}>D</option>
        <option value="F" ${player.foretelling === "F" ? "selected" : ""}>F</option>
    </select>
</td>
        </tr>`;
    });

}

async function updateGrade(id, column, value) {

    const { error } = await sb
        .from("gradeTable")
        .update({
            [column]: value === "" ? null : value
        })
        .eq("id", id);

    if (error) {
        console.log("Grade update failed:", error);
    }

}



window.addEventListener("load", async () => {

    const loggedIn = await verifyPlayerLogin();

    if (!loggedIn) {
        return;
    }

    await loadGrades();

});
</script>
</body>
</html>
