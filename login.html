<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spellbound Terminal Authentication</title>
   /* <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>*/
    <style>
        body { font-family: Arial, sans-serif; background-color: #0c0a0f; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .login-card { background: rgba(17, 12, 28, 0.9); padding: 40px; border-radius: 16px; max-width: 400px; width: 100%; text-align: center; border: 2px solid #6d28d9; box-shadow: 0 10px 30px rgba(109, 40, 217, 0.2); }
        input { width: 100%; padding: 14px; box-sizing: border-box; background: #141021; border: 1px solid #4c1d95; color: #fff; border-radius: 8px; font-size: 1.2rem; text-align: center; letter-spacing: 4px; margin-top: 20px; }
        button { width: 100%; padding: 14px; background: #7c3aed; color: white; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; font-size: 1rem; }
        button:hover { background: #6d28d9; }
        .status { margin-top: 15px; color: #9ca3af; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔐 Identity Verification</h2>
        <p id="promptDesc">Verifying artifact token sequence...</p>
        
        <!--Input field is visible right away-->
        <input type="password" id="pinInput" placeholder="ENTER PIN" maxlength="6">
        <button id="authBtn">Enter Spellbound</button>

        <div class="status" id="statusMsg">Awaiting verification pin...</div>
    </div>

    <script>
/*import { createClient } from '@supabase/supabase-js';*/

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
const SUPABASE_URL = "https://ninumgueglotdpyewmhg.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pbnVtZ3VlZ2xvdGRweWV3bWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjQ5NjcsImV4cCI6MjEwMDk0MDk2N30.CyBpEIcTWG9J9Ijx1q1Hh6ZEtX1r4t5UeQCA6BmplhM";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);



        /* 1. Automatically grab the text from the link address bar and looks for '?id='string*/
        const urlParams = new URLSearchParams(window.location.search);
        const characterEmail = urlParams.get('id'); 

        /* 2. Security Check: Ensure they actually arrived here via a valid character QR code*/
        if (!characterEmail) {
            document.getElementById("promptDesc").innerText = "ACCESS DENIED: No character artifact detected.";
            document.getElementById("pinInput").style.display = "none";
            document.getElementById("authBtn").style.display = "none";
            document.getElementById("statusMsg").innerText = "Please scan a physical character card.";
        } else {
            /* Clean up display text to show who is checking in*/
            document.getElementById("promptDesc").innerText = `Unlocking sequence for token: ${characterEmail}`;
            document.getElementById("pinInput").focus();
        }

        /* 3. Process the PIN submission */
        document.getElementById("authBtn").addEventListener("click", async () => {
            const enteredPin = document.getElementById("pinInput").value;
            document.getElementById("statusMsg").innerText = "Authorizing credentials...";

            const { error } = await supabase.auth.signInWithPassword({
                email: characterEmail, // Fed automatically from the QR link code
                password: enteredPin
            });

            if (error) {
                alert("ACCESS DENIED: Invalid PIN mapping for this character.");
                document.getElementById("pinInput").value = "";
                document.getElementById("statusMsg").innerText = "Awaiting verification pin...";
            } else {
                // Success! Route straight to your character page dashboard
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
