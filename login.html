<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spellbound Login</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        body { 
    font-family: Arial, sans-serif; 
    background-color: #0c0a0f; 
    color: #f3f4f6; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    margin: 0; 
    padding: 15px 15px 120px; 
    box-sizing: border-box; 
	}
        
	.login-card { 
	    background: rgba(17, 12, 28, 0.9); 
	    padding: clamp(20px, 5vw, 40px);
	    border-radius: 16px; 
	    width: 100%;
	    max-width: 400px;
	    box-sizing: border-box;
	    text-align: center; 
	    border: 2px solid #6d28d9; 
	    box-shadow: 0 10px 30px rgba(109, 40, 217, 0.2); 
	}

        input { 
	    width: 100%; 
	    padding: 14px; 
	    box-sizing: border-box; 
	    background: #141021; 
	    border: 1px solid #4c1d95; 
	    color: #fff; 
	    border-radius: 8px; 
	    font-size: 1.2rem; 
	    text-align: center; 
	    letter-spacing: 4px; 
	    margin-top: 20px; 
	}
        
	button { 
	    width: 100%; 
	    padding: 14px;
	    box-sizing: border-box; 
	    background: #7c3aed; 
	    color: white; 
	    border: none; 
	    font-weight: bold; 
	    border-radius: 8px; 
	    cursor: pointer; 
	    margin-top: 15px; 
	    font-size: 1rem; 
	}
        
	button:hover { background: #6d28d9; }

        .status {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 0;
    margin-top: 10px;
    color: #9ca3af;
    font-size: 1.1rem;
    text-align: center;
}
    </style>
</head>
    <body>
	<h1>Welcome to Spellbound!</h1>

	<form id="loginForm">
            <div class="login-card">
<select id="characterSelect">
    <option value="">Select Character</option>
</select>

                <!--Input field is visible right away-->
                <input type="password" id="pinInput" placeholder="ENTER PIN" maxlength="4">
                <button id="authBtn" type="submit">Enter Spellbound</button>
                <div class="status" id="statusMsg"></div>
            </div>
	</form>
	<h3>A game by Freeform Games</h3>


 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="session.js"></script>


	<script>
	    
//Get all the login information
document.getElementById("loginForm").addEventListener("submit", async (event) => {

    event.preventDefault();

    const playerID = document.getElementById("characterSelect").value;
    const enteredPin = document.getElementById("pinInput").value;

if (!playerID) {

    document.getElementById("statusMsg").innerText =
        "Please select your character.";

    return;
}

    document.getElementById("statusMsg").innerText =
        "Checking credentials...";


    const { data, error } = await sb
        .from("spellboundPlayers")
        .select("*")
        .eq("playerID", playerID)
        .eq("pin", enteredPin)
        .single();


    if (error || !data) {

        document.getElementById("statusMsg").innerText =
            "WRONG PIN";

        document.getElementById("pinInput").value = "";

        return;
    }


localStorage.setItem("playerID", data.playerID);
localStorage.setItem("playerName", data.name);
localStorage.setItem("playerPosition", data.position);
localStorage.setItem("playerData", JSON.stringify(data));


    if (data.position?.toLowerCase() === "admin") {

        window.location.href = "admin.html";

    } else {

        window.location.href = "index.html";

    }

});

	</script>
    </body>
</html>
