<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="session.js"></script>

<title>Game Timeline</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<h1>Game Timeline</h1>


<div class="text-box">

<button onclick="createTimeline()">
Create Timeline
</button>


<div id="timeline"></div>


</div>


<a href="admin.html" class="back-btn">
Back
</a>


<script>

function createTimeline() {

const startHour = prompt(
    "What hour does the game start? Example: 7"
);


if (!startHour) {
    return;
}


    const events = [

        {
            minutes: 30,
            text: "Send Introduction to the Game announcement"
        },

        {
            minutes: 60,
            text: `Alchemy Exam Announcement: You give out potions for exam.<br><br>

	    Deadly Poison: Ashes, Lizard Scales<br>
	    Tongue-tied Potion: Ashes, Powdered Dragon Fang<br>
	    Healing Potion: Lizard Scales, Moonbeam Dust`
        },

        {
            minutes: 90,
            text: "Transformation Exam Announcement: You get cauldron AND pencil to Professor Karlsen"
        },

        {
            minutes: 115,
            text: "Foretelling Exam Announcement, THEN End of Exams Announcement once they're over."
        },

	{
            minutes: 135,
            text: `A Message Beyond the Grave Announcement if not already given.<br>
Gather Professors to determine scholarship winner.`
        },

        {
            minutes: 170,
            text: "Announce Scholarship Winner"
        },

        {
            minutes: 180,
            text: "Game End Announcements"
        }


    ];



   let html = "";

events.forEach(event => {

    let totalMinutes = Number(startHour) * 60 + event.minutes;

    let hours = Math.floor(totalMinutes / 60);
    let minutes = totalMinutes % 60;


    html += `

    <p>
        <strong>
        ${hours}:${minutes.toString().padStart(2, "0")}
        </strong>

        -
        ${event.text}

    </p>

    `;

});


document.getElementById("timeline").innerHTML = html;

localStorage.setItem("gameTimeline", html);

}


async function checkAdmin() {

    const player = JSON.parse(
        localStorage.getItem("playerData")
    );

    if (!player || player.position?.toLowerCase() !== "admin") {
        window.location.href = "index.html";
        return false;
    }

    return true;
}


window.addEventListener("load", async () => {

    const loggedIn = await verifyPlayerLogin();

    if (!loggedIn) {
        return;
    }

    const allowed = await checkAdmin();

    if (!allowed) {
        return;
    }

const savedTimeline = localStorage.getItem("gameTimeline");

if (savedTimeline) {
    document.getElementById("timeline").innerHTML = savedTimeline;
}

});

</script>


</body>
</html>
