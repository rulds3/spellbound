<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="session.js"></script>

<title>Game Timeline</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<h1>Game Timeline</h1>


<div class="text-box">

<div id="timeline"></div>

<div class="timeline-button">
    <button class="game-btn" onclick="createTimeline()">
        Create Timeline
    </button>
</div>

</div>


<a href="adminReference.html" class="back-btn">
Back
</a>


<script>

function createTimeline() {

     const startHour = prompt(
        "What time are you starting? Example: 7"
    );

    const events = [

        {
            minutes: 30,
            text: `*Send Introduction to the Game announcement.<br>
	    *If no one has asked to see the crime scene yet, suggest it to the detectives.`
        },

        {
            minutes: 60,
            text: `Alchemy Exam Announcement: You give out potions for exam.<br>

	    <div class="indent">*Deadly Poison: Ashes, Lizard Scales<br>
	    *Tongue-tied Potion: Ashes, Powdered Dragon Fang<br>
	    *Healing Potion: Lizard Scales, Moonbeam Dust</div>`
        },

        {
            minutes: 90,
            text: "Transformation Exam Announcement: You get <i>cauldron AND pencil</i> to Professor Karlsen"
        },

        {
            minutes: 115,
            text: `*Foretelling Exam Announcement<br> 
	    *End of Exams Announcement once they're over.</div>`
        },

	{
            minutes: 135,
            text: `*A Message Beyond the Grave Announcement if not already given.<br>
		*Gather Professors to determine scholarship winner.</div>`
        },

        {
            minutes: 170,
            text: "Announce Scholarship Winner"
        },

        {
            minutes: 180,
            text: `
<ul>
    <li>Game End Announcments</li>
    <li>Read “The Solution”.</li>
    <li>
        Have everyone point to (but don’t reveal yet):
        <ul>
            <li>Who they think has been stealing wands.</li>
            <li>Who they think is Callie Fu.</li>
            <li>The person who ruined Casey’s motorcycle.</li>
            <li>The person trying to blow up the school.</li>
        </ul>
    </li>
    <li>
        Have everyone say who they were, what they were up to, and whether
        they succeeded or not.
    </li>
</ul>`
        }


    ];



  let html = `

<table class="timeline-table">

    <thead>
        <tr>
            <th>Time</th>
            <th>Event</th>
        </tr>
    </thead>

    <tbody>

`;

events.forEach(event => {

    let totalMinutes = Number(startHour) * 60 + event.minutes;

    let hours = Math.floor(totalMinutes / 60);
    let minutes = totalMinutes % 60;


    html += `

        <tr>

            <td>
                <strong>
                ${hours}:${minutes.toString().padStart(2, "0")}
                </strong>
            </td>

            <td>
                ${event.text}
            </td>

        </tr>

    `;

});


html += `

    </tbody>

</table>

`;


document.getElementById("timeline").innerHTML = html;

localStorage.setItem("gameTimeline", html);

}


async function loadTimeline() {

    const savedTimeline = localStorage.getItem("gameTimeline");

    if (savedTimeline) {
        document.getElementById("timeline").innerHTML = savedTimeline;
    }

}


window.addEventListener("load", async () => {

    const loggedIn = await verifyPlayerLogin();

    if (!loggedIn) {
        return;
    }

    const allowed = await checkAdmin();

    if (!allowed) {
        return;
    }

    await loadTimeline();

});

</script>


</body>
</html>
